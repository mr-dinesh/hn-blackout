name: Post HN Blackout poem

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 IST, once a day
  workflow_dispatch:        # manual trigger from the Actions tab
    inputs:
      dry_run:
        description: 'Render the image as an artifact, post nothing'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Never let two runs post (and commit state) at the same time.
    concurrency:
      group: hn-blackout-post
      cancel-in-progress: false
    # Needed to push bot/posted.json back to the repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r bot/requirements.txt
          python -m playwright install --with-deps chromium   # for the HN screenshot

      - name: Dry run (render only)
        if: ${{ inputs.dry_run }}
        run: python bot/post_poem.py --dry-run

      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: bot/out/

      # A platform whose secrets are unset is skipped.
      - name: Post poem
        if: ${{ !inputs.dry_run }}
        run: python bot/post_poem.py
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}

      # Committing the history does two jobs:
      #  1. a second run on the same day sees today's entry and skips;
      #  2. it counts as repository activity, so GitHub does not auto-disable
      #     this scheduled workflow after 60 days without commits.
      - name: Commit posted history
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "hn-blackout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/posted.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — posted.json unchanged."
            exit 0
          fi
          git commit -m "chore: record today's poem"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/3); pulling with rebase..."
            git pull --rebase
          done
          echo "ERROR: all 3 push attempts failed — posted history not saved."
          exit 1
