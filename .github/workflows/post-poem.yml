name: Post HN Blackout poem

on:
  schedule:
    # 09:00 IST, plus two backup slots. GitHub starts scheduled runs late or drops
    # them when busy (10 Nov 2026: the 09:00 run never started). Only the first run
    # that starts each IST day posts; later ones find today in bot/posted.json and skip.
    # Minutes avoid the top of the hour, when GitHub's scheduler is busiest.
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 IST
    - cron: '40 4 * * *'   # 04:40 UTC = 10:10 IST (backup)
    - cron: '10 6 * * *'   # 06:10 UTC = 11:40 IST (backup)
  workflow_dispatch:        # manual trigger from the Actions tab
    inputs:
      dry_run:
        description: 'Render the image as an artifact, post nothing'
        type: boolean
        default: false
      force:
        description: 'Post even if today already has a poem'
        type: boolean
        default: false
      only:
        description: 'Post to one platform only (use with force to add a missed one)'
        type: choice
        options: [both, bluesky, mastodon]
        default: both

jobs:
  post:
    runs-on: ubuntu-latest
    # Never let two runs post (and commit state) at the same time.
    concurrency:
      group: hn-blackout-post
      cancel-in-progress: false
    # Needed to push bot/posted.json back to the repo.
    permissions:
      contents: write

    steps:
      # Check out the tip of main as it is when the job starts, not the commit that
      # existed when the run was triggered. A backup run queued behind the concurrency
      # group then sees the posted.json entry the earlier run pushed, and skips.
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r bot/requirements.txt
          python -m playwright install --with-deps chromium   # for the HN screenshot

      - name: Dry run (render only)
        if: ${{ inputs.dry_run }}
        run: python bot/post_poem.py --dry-run

      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: bot/out/

      # A platform whose secrets are unset is skipped.
      - name: Post poem
        if: ${{ !inputs.dry_run }}
        run: python bot/post_poem.py ${{ inputs.force && '--force' || '' }} ${{ (inputs.only == 'bluesky' || inputs.only == 'mastodon') && format('--only {0}', inputs.only) || '' }}
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}

      # Committing the history does two jobs:
      #  1. a second run on the same day sees today's entry and skips;
      #  2. it counts as repository activity, so GitHub does not auto-disable
      #     this scheduled workflow after 60 days without commits.
      - name: Commit posted history
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "hn-blackout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/posted.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — posted.json unchanged."
            exit 0
          fi
          git commit -m "chore: record today's poem"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}/3); pulling with rebase..."
            git pull --rebase
          done
          echo "ERROR: all 3 push attempts failed — posted history not saved."
          exit 1
